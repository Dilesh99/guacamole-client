<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="vdeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#16213e" stroke="url(#vdeGradient)" stroke-width="3"/>
  
  <!-- Monitor/Screen shape -->
  <rect x="20" y="25" width="60" height="40" rx="3" ry="3" fill="#1a1a2e" stroke="#00d9ff" stroke-width="2"/>
  
  <!-- Screen inner glow -->
  <rect x="24" y="29" width="52" height="32" rx="2" ry="2" fill="#0f3460"/>
  
  <!-- Desktop grid lines representing virtual desktop -->
  <g stroke="#00d9ff" stroke-width="0.5" opacity="0.6">
    <line x1="24" y1="45" x2="76" y2="45"/>
    <line x1="50" y1="29" x2="50" y2="61"/>
  </g>
  
  <!-- Virtual windows representation -->
  <rect x="27" y="32" width="20" height="10" rx="1" fill="#e94560" opacity="0.8"/>
  <rect x="53" y="32" width="20" height="10" rx="1" fill="#00d9ff" opacity="0.8"/>
  <rect x="27" y="48" width="20" height="10" rx="1" fill="#00d9ff" opacity="0.8"/>
  <rect x="53" y="48" width="20" height="10" rx="1" fill="#e94560" opacity="0.8"/>
  
  <!-- Monitor stand -->
  <path d="M 42 65 L 58 65 L 55 73 L 45 73 Z" fill="#16213e" stroke="#00d9ff" stroke-width="1.5"/>
  
  <!-- Base -->
  <ellipse cx="50" cy="76" rx="18" ry="4" fill="#16213e" stroke="#00d9ff" stroke-width="1.5"/>
  
  <!-- Connection dots representing remote access -->
  <circle cx="50" cy="45" r="2" fill="#00d9ff" filter="url(#glow)"/>
</svg>